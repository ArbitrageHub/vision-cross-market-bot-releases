# Customer VDS install — published as-is to the public releases repo by
# .github/workflows/release-backend.yml. No secrets in this file; it reads
# everything from the .env installed alongside it by install-backend.sh.
#
# Deliberately simpler than the operator's own docker-compose.prod.yml:
# no shared-infra network, no nginx nginx path-routing (customers get the
# backend on a plain host port — put your own reverse proxy/TLS in front
# if you want one, see docs/CUSTOMER_INSTALL.md), one backend + its own
# dedicated orderbook Redis, nothing shared with any other deployment.
x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis-polymarket-clob:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: arbvision_redis
    command: >
      --requirepass=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      --maxmemory=1gb
      --cache_mode=true
      --proactor_threads=2
      --snapshot_cron=""
    volumes:
      - redis_data:/data
    restart: unless-stopped
    <<: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  arbvision-api:
    image: ${ARBVISION_IMAGE:?Set ARBVISION_IMAGE, e.g. ghcr.io/arbitragehub/vision-cross-market-bot-backend:latest}
    container_name: arbvision_api
    env_file:
      - path: .env
        required: true
    environment:
      APP_ENV: production
      TZ: UTC
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      PS3838_HEADLESS: "true"
      PS3838_BROWSER_USER_DATA_DIR: /app/data/browser/ps3838
      DATABASE_URL: sqlite+aiosqlite:////app/data/arbitrage.db
      REDIS_URL: redis://arbvision_redis:6379/2
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      POLYMARKET_ORDERBOOK_WS_ENABLED: "true"
      POLYMARKET_ORDERBOOK_REDIS_HOST: arbvision_redis
      POLYMARKET_ORDERBOOK_REDIS_PORT: "6379"
      POLYMARKET_ORDERBOOK_REDIS_PUBLISH: "true"
      # Points at the OPERATOR's central service — not something the
      # customer runs themselves. Value comes from .env (install-backend.sh
      # writes it, not secret, same value used everywhere).
      CENTRAL_SERVICE_URL: ${CENTRAL_SERVICE_URL:?Set CENTRAL_SERVICE_URL}
    ports:
      # Exposed on the host directly (no reverse proxy assumed for a fresh
      # customer install) — the desktop app's Settings > Backend URL points
      # here. Firewall this to your own IP, or put TLS in front of it,
      # yourself; see docs/CUSTOMER_INSTALL.md.
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      redis-polymarket-clob:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  redis_data:
    driver: local
